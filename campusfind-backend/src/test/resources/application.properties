# ==============================================================================
# CampusFind AI - Test Configuration
# ==============================================================================
# Isolated in-memory H2 database for automated tests so tests never modify
# or delete development/production data.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

campusfind.ai.service-url=http://localhost:5000
campusfind.ai.similarity-threshold=0.60
campusfind.ai.match-limit=6

campusfind.chatbot.api-url=https://api.groq.com/openai/v1/chat/completions
campusfind.chatbot.api-token=
campusfind.chatbot.model-id=llama-3.1-8b-instant
campusfind.chatbot.connect-timeout-ms=2000
campusfind.chatbot.read-timeout-ms=2000
campusfind.chatbot.max-tokens=100
campusfind.chatbot.max-history=6

