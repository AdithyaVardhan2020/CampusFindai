# ==============================================================================
# CampusFind AI - Spring Boot Application Configuration
# ==============================================================================

server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:aiven}

# ------------------------------------------------------------------------------
# Database Configuration
# ------------------------------------------------------------------------------
# Default: Local persistent file-based H2 database in ./data/campusfinddb so user accounts
# and reports survive application restarts.
# Cloud / Production: Override via environment variables:
#   SPRING_DATASOURCE_URL (e.g. jdbc:mysql://host:port/dbname?sslMode=REQUIRED)
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME (com.mysql.cj.jdbc.Driver)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/campusfinddb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# HikariCP Connection Pool Settings (cloud-resilient connection test & timeout)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings (Safe 'validate' mode protects existing Aiven MySQL records from alteration)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (local development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ------------------------------------------------------------------------------
# Administrator Bootstrap (Environment Variables)
# ------------------------------------------------------------------------------
# To securely provision the initial administrator, provide environment variables:
#   CAMPUSFIND_ADMIN_EMAIL=admin@campus.edu
#   CAMPUSFIND_ADMIN_PASSWORD=YourSecurePasswordHere
#   CAMPUSFIND_ADMIN_NAME="Campus Administrator"
#   CAMPUSFIND_ADMIN_RESET_PASSWORD=false (set to 'true' only to perform explicit one-time password reset)
# If not supplied, automatic administrator provisioning is skipped.
campusfind.admin.email=${CAMPUSFIND_ADMIN_EMAIL:}
campusfind.admin.password=${CAMPUSFIND_ADMIN_PASSWORD:}
campusfind.admin.full-name=${CAMPUSFIND_ADMIN_NAME:System Administrator}
campusfind.admin.reset-password=${CAMPUSFIND_ADMIN_RESET_PASSWORD:false}

# ------------------------------------------------------------------------------
# In-Process ONNX Runtime AI Configuration (OpenCLIP ViT-B/32 INT8)
# ------------------------------------------------------------------------------
campusfind.ai.onnx.enabled=${CAMPUSFIND_AI_ONNX_ENABLED:true}
campusfind.ai.onnx.model-path=${CAMPUSFIND_AI_MODEL_PATH:models/openclip_vit_b32_int8.onnx}
campusfind.ai.onnx.max-concurrent-inferences=${CAMPUSFIND_AI_CONCURRENCY_LIMIT:3}

# Remote AI Microservice Fallback (optional / legacy)
campusfind.ai.service-url=${CAMPUSFIND_AI_URL:http://localhost:5000}
campusfind.ai.connect-timeout-ms=${CAMPUSFIND_AI_CONNECT_TIMEOUT_MS:3000}
campusfind.ai.read-timeout-ms=${CAMPUSFIND_AI_READ_TIMEOUT_MS:15000}
campusfind.ai.similarity-threshold=${CAMPUSFIND_AI_SIMILARITY_THRESHOLD:0.60}
campusfind.ai.match-limit=${CAMPUSFIND_AI_MATCH_LIMIT:6}

# ------------------------------------------------------------------------------
# CORS Configuration (Development Origins and Production Vercel Patterns)
# ------------------------------------------------------------------------------
campusfind.cors.allowed-origins=${CAMPUSFIND_CORS_ALLOWED_ORIGINS:http://localhost:5000,http://127.0.0.1:5000,http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,https://*.vercel.app}

# ------------------------------------------------------------------------------
# Request Body & Multipart Size Limits (Support Base64 Image Uploads)
# ------------------------------------------------------------------------------
server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# Groq AI Help Chatbot Configuration
# ------------------------------------------------------------------------------
campusfind.chatbot.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
campusfind.chatbot.api-token=${GROQ_API_KEY:${HF_TOKEN:}}
campusfind.chatbot.model-id=${GROQ_MODEL_ID:llama-3.1-8b-instant}
campusfind.chatbot.connect-timeout-ms=${GROQ_CONNECT_TIMEOUT_MS:5000}
campusfind.chatbot.read-timeout-ms=${GROQ_READ_TIMEOUT_MS:20000}
campusfind.chatbot.max-tokens=${GROQ_MAX_TOKENS:500}
campusfind.chatbot.max-history=${GROQ_MAX_HISTORY:6}


